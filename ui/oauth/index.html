<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OAuth group administration</title>
    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061018;
        --panel: #0e1a24;
        --panel-2: #101f2c;
        --border: #24384a;
        --text: #ecf4fb;
        --muted: #9fb1c2;
        --accent: #58c4dd;
        --success: #47d18c;
        --danger: #ff7a90;
        --field: #07131d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: linear-gradient(135deg, #061018 0%, #102232 54%, #12291f 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar,
      .panel,
      .result-card {
        border: 1px solid var(--border);
        background: rgba(14, 26, 36, 0.92);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px;
        border-radius: 8px;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 1.8rem;
        line-height: 1.1;
      }

      h2 {
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .account {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.7fr);
        gap: 16px;
        margin-top: 16px;
      }

      .panel {
        border-radius: 8px;
        padding: 20px;
      }

      .grid {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label,
      .result-label {
        color: var(--muted);
        font-size: 0.77rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field);
        color: var(--text);
        padding: 12px 13px;
        font: inherit;
        outline: none;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(88, 196, 221, 0.16);
      }

      input[readonly] {
        color: #d8e7f2;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
      }

      button {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 11px 14px;
        min-height: 42px;
        font: inherit;
        font-weight: 700;
        color: #031019;
        background: var(--accent);
        cursor: pointer;
      }

      button.secondary {
        border-color: var(--border);
        color: var(--text);
        background: var(--panel-2);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .result-grid {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }

      .result-card {
        padding: 16px;
        border-radius: 8px;
      }

      .result-label {
        display: block;
        margin-bottom: 8px;
      }

      [hidden] {
        display: none !important;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%) translateY(16px);
        width: min(620px, calc(100% - 32px));
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(6, 16, 24, 0.96);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast[data-open="true"] {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast[data-kind="success"] {
        border-color: rgba(71, 209, 140, 0.5);
      }

      .toast[data-kind="error"] {
        border-color: rgba(255, 122, 144, 0.5);
      }

      .toast strong {
        color: var(--accent);
      }

      @media (max-width: 860px) {
        .layout,
        .topbar {
          grid-template-columns: 1fr;
          display: grid;
        }

        .actions {
          justify-content: stretch;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>OAuth group administration</h1>
          <div class="account" id="accountLabel">Signed out</div>
        </div>
        <div class="actions" style="margin-top: 0">
          <button id="signInButton" type="button">Sign in</button>
          <button class="secondary" id="signOutButton" type="button" hidden>Sign out</button>
        </div>
      </section>

      <section class="layout" id="adminLayout" hidden>
        <form class="panel" id="groupsForm">
          <h2>Groups</h2>
          <div class="grid">
            <div class="field">
              <label for="oauthUserGroup">OAUTH_USER_GROUP</label>
              <input id="oauthUserGroup" autocomplete="off" />
            </div>
            <div class="field">
              <label for="newsGroup">NEWS_PL_GROUP</label>
              <input id="newsGroup" autocomplete="off" />
            </div>
            <div class="field">
              <label for="weatherGroup">WEATHER_PL_GROUP</label>
              <input id="weatherGroup" autocomplete="off" />
            </div>
            <div class="field">
              <label for="currencyGroup">CURRENCY_PL_GROUP</label>
              <input id="currencyGroup" autocomplete="off" />
            </div>
            <div class="field">
              <label for="stockGroup">STOCK_PL_GROUP</label>
              <input id="stockGroup" autocomplete="off" />
            </div>
          </div>
          <div class="actions">
            <button class="secondary" id="refreshGroupsButton" type="button">Refresh</button>
            <button id="saveGroupsButton" type="submit">Save groups</button>
          </div>
        </form>

        <div class="panel">
          <form id="oauthForm">
            <h2>Register client</h2>
            <div class="grid">
              <div class="field">
                <label for="endpoint">Register endpoint</label>
                <input id="endpoint" value="/oauth/register" autocomplete="off" />
              </div>
              <div class="field">
                <label for="clientName">Client name</label>
                <input id="clientName" value="My Connector" autocomplete="off" />
              </div>
              <div class="field">
                <label for="redirectUris">Redirect URI(s)</label>
                <textarea id="redirectUris" spellcheck="false">https://claude.ai/api/mcp/auth_callback</textarea>
              </div>
            </div>
            <div class="actions">
              <button id="registerButton" type="submit">Register client</button>
            </div>
          </form>

          <div class="result-grid">
            <div class="result-card">
              <label class="result-label" for="clientId">Client ID</label>
              <input id="clientId" readonly placeholder="Generated after registration" />
            </div>
            <div class="result-card">
              <label class="result-label" for="clientSecret">Client secret</label>
              <input id="clientSecret" readonly placeholder="Generated after registration" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" data-kind="success" data-open="false" role="status" aria-live="polite">
      <strong id="toastMark">Success</strong>
      <span id="toastMessage"></span>
    </div>

    <script>
      const apiBase = window.location.pathname.replace(/\/oauth\/?$/, "") || "/api/v1";
      const configEndpoint = `${apiBase}/oauth/config`;
      const groupsEndpoint = `${apiBase}/oauth/groups`;

      const accountLabel = document.getElementById("accountLabel");
      const signInButton = document.getElementById("signInButton");
      const signOutButton = document.getElementById("signOutButton");
      const adminLayout = document.getElementById("adminLayout");
      const groupsForm = document.getElementById("groupsForm");
      const refreshGroupsButton = document.getElementById("refreshGroupsButton");
      const saveGroupsButton = document.getElementById("saveGroupsButton");
      const oauthUserGroupEl = document.getElementById("oauthUserGroup");
      const newsGroupEl = document.getElementById("newsGroup");
      const weatherGroupEl = document.getElementById("weatherGroup");
      const currencyGroupEl = document.getElementById("currencyGroup");
      const stockGroupEl = document.getElementById("stockGroup");
      const form = document.getElementById("oauthForm");
      const endpointEl = document.getElementById("endpoint");
      const clientNameEl = document.getElementById("clientName");
      const redirectUrisEl = document.getElementById("redirectUris");
      const registerButton = document.getElementById("registerButton");
      const clientIdEl = document.getElementById("clientId");
      const clientSecretEl = document.getElementById("clientSecret");
      const toastEl = document.getElementById("toast");
      const toastMarkEl = document.getElementById("toastMark");
      const toastMessageEl = document.getElementById("toastMessage");

      let msalClient;
      let msalConfig;
      let activeAccount;
      let toastTimer;
      signInButton.disabled = true;

      function normalizeRedirectUris(text) {
        return text
          .split(/\r?\n|,/)
          .map((value) => value.trim())
          .filter(Boolean);
      }

      function clearResults() {
        clientIdEl.value = "";
        clientSecretEl.value = "";
      }

      function showToast(kind, message) {
        clearTimeout(toastTimer);
        toastEl.dataset.kind = kind;
        toastMarkEl.textContent = kind === "success" ? "Success" : "Error";
        toastMessageEl.textContent = ` ${message}`;
        toastEl.dataset.open = "true";
        toastTimer = window.setTimeout(() => {
          toastEl.dataset.open = "false";
        }, 4600);
      }

      function readResponsePayload(response, contentType, text) {
        if (contentType.includes("application/json")) {
          return text ? JSON.parse(text) : {};
        }
        return text ? { detail: text } : {};
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        const contentType = response.headers.get("content-type") || "";
        const bodyText = await response.text();
        const payload = readResponsePayload(response, contentType, bodyText);
        if (!response.ok) {
          const detail = payload.detail || payload.error || {};
          const message = detail.message || detail.error_description || detail.code || payload.error || response.statusText;
          throw new Error(message || "Request failed.");
        }
        return payload;
      }

      function tokenRequest() {
        const scope = msalConfig.scope || `${msalConfig.clientId}/.default`;
        return { scopes: [scope], account: activeAccount };
      }

      async function accessToken() {
        try {
          return (await msalClient.acquireTokenSilent(tokenRequest())).accessToken;
        } catch (_) {
          return (await msalClient.acquireTokenPopup(tokenRequest())).accessToken;
        }
      }

      function setSignedIn(account) {
        activeAccount = account;
        msalClient.setActiveAccount(account);
        accountLabel.textContent = account?.username || account?.name || "Signed in";
        signInButton.hidden = true;
        signOutButton.hidden = false;
        adminLayout.hidden = false;
      }

      function setSignedOut() {
        activeAccount = null;
        accountLabel.textContent = "Signed out";
        signInButton.hidden = false;
        signOutButton.hidden = true;
        adminLayout.hidden = true;
      }

      function renderGroups(groups) {
        oauthUserGroupEl.value = groups.OAUTH_USER_GROUP || "";
        newsGroupEl.value = groups.NEWS_PL_GROUP || "all";
        weatherGroupEl.value = groups.WEATHER_PL_GROUP || "all";
        currencyGroupEl.value = groups.CURRENCY_PL_GROUP || "all";
        stockGroupEl.value = groups.STOCK_PL_GROUP || "all";
      }

      async function loadGroups() {
        const token = await accessToken();
        const payload = await fetchJson(configEndpoint, {
          headers: { Authorization: `Bearer ${token}` },
        });
        renderGroups(payload.groups || {});
      }

      async function saveGroups(event) {
        event.preventDefault();
        saveGroupsButton.disabled = true;
        try {
          const token = await accessToken();
          const payload = await fetchJson(groupsEndpoint, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              OAUTH_USER_GROUP: oauthUserGroupEl.value.trim(),
              NEWS_PL_GROUP: newsGroupEl.value.trim() || "all",
              WEATHER_PL_GROUP: weatherGroupEl.value.trim() || "all",
              CURRENCY_PL_GROUP: currencyGroupEl.value.trim() || "all",
              STOCK_PL_GROUP: stockGroupEl.value.trim() || "all",
            }),
          });
          renderGroups(payload.groups || {});
          showToast("success", "Group settings saved.");
        } catch (error) {
          showToast("error", error instanceof Error ? error.message : String(error));
        } finally {
          saveGroupsButton.disabled = false;
        }
      }

      async function signIn() {
        if (!msalClient) {
          // Root Cause vs Logic: loginPopup runs before `msalClient` is assigned because init is async; wait until the client is ready before showing the popup.
          showToast("error", "Authentication is still initializing.");
          return;
        }
        try {
          const response = await msalClient.loginPopup({ scopes: ["openid", "profile", "email"] });
          setSignedIn(response.account);
          await loadGroups();
          showToast("success", "Signed in.");
        } catch (error) {
          showToast("error", error instanceof Error ? error.message : String(error));
        }
      }

      async function signOut() {
        const account = activeAccount;
        setSignedOut();
        if (account) {
          await msalClient.logoutPopup({ account });
        }
      }

      async function registerClient(event) {
        event.preventDefault();
        const endpoint = endpointEl.value.trim() || "/oauth/register";
        const clientName = clientNameEl.value.trim();
        const redirect_uris = normalizeRedirectUris(redirectUrisEl.value);

        if (!clientName || !redirect_uris.length) {
          clearResults();
          showToast("error", "Client name and redirect URI are required.");
          return;
        }

        registerButton.disabled = true;
        try {
          const payload = await fetchJson(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ client_name: clientName, redirect_uris }),
          });

          const client_id = payload.client_id ?? "";
          const client_secret = payload.client_secret ?? "";
          if (!client_id || !client_secret) {
            throw new Error("The registration response did not include a client ID and secret.");
          }

          clientIdEl.value = client_id;
          clientSecretEl.value = client_secret;
          showToast("success", "Client credentials created.");
        } catch (error) {
          clearResults();
          showToast("error", error instanceof Error ? error.message : String(error));
        } finally {
          registerButton.disabled = false;
        }
      }

      async function init() {
        signInButton.disabled = true;
        const payload = await fetchJson(configEndpoint);
        msalConfig = payload.msal || {};
        if (!msalConfig.clientId || !msalConfig.tenantId) {
          signInButton.disabled = true;
          showToast("error", "OAUTH_CLIENT_ID and OAUTH_TENANT_ID are required.");
          return;
        }

        msalClient = new msal.PublicClientApplication({
          auth: {
            clientId: msalConfig.clientId,
            authority: msalConfig.authority || `https://login.microsoftonline.com/${msalConfig.tenantId}`,
            redirectUri: window.location.href,
          },
          cache: {
            cacheLocation: "sessionStorage",
          },
        });

        signInButton.disabled = false;

        const existing = msalClient.getAllAccounts()[0];
        if (existing) {
          setSignedIn(existing);
          await loadGroups();
        }
      }

      signInButton.addEventListener("click", signIn);
      signOutButton.addEventListener("click", signOut);
      refreshGroupsButton.addEventListener("click", loadGroups);
      groupsForm.addEventListener("submit", saveGroups);
      form.addEventListener("submit", registerClient);
      init().catch((error) => showToast("error", error instanceof Error ? error.message : String(error)));
    </script>
  </body>
</html>
