[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hth-stock-intelligence"
version = "1.0.0"
description = "Phase 1 inventory intelligence FastAPI service for Harmonise-backed stock workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mcp>=1.27,<2.0",
  "pydantic-settings>=2.3,<3.0",
  "redis>=5.0,<6.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
hth-stock-intelligence-mcp = "app.mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "harmonise*"]
